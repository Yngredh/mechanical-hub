name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.5
  JAVA_VERSION: '21'

jobs:

  # ── Job 1: Build and test the Java application ──────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -B --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Resolve infrastructure from the remote states ────────────────────
  resolve-infra:
    name: Resolve Infrastructure Outputs
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      eks-cluster-name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}
      ecr-repository-name: ${{ steps.tf-outputs.outputs.ecr_repository_name }}
      rds-endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}
      rds-port: ${{ steps.tf-outputs.outputs.rds_port }}
      rds-db-name: ${{ steps.tf-outputs.outputs.rds_db_name }}
      rds-username: ${{ steps.tf-outputs.outputs.rds_username }}
      otlp-http-endpoint: ${{ steps.tf-outputs.outputs.otlp_http_endpoint }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (read-only remote states)
        working-directory: ci/remote-state
        run: terraform init -input=false

      - name: Read remote states
        working-directory: ci/remote-state
        env:
          TF_VAR_state_bucket: mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_state_region: ${{ env.AWS_REGION }}
        run: terraform apply -auto-approve -input=false

      - name: Publish contract outputs
        id: tf-outputs
        working-directory: ci/remote-state
        run: |
          set -euo pipefail
          for o in eks_cluster_name ecr_repository_url \
                   rds_endpoint rds_port rds_db_name rds_username; do
            value="$(terraform output -raw "$o")"
            if [ -z "$value" ]; then
              echo "::error::Output '$o' veio vazio dos states remotos. Aplique mechanical-hub-infra e mechanical-hub-database antes deste pipeline."
              exit 1
            fi
            echo "${o}=${value}" >> "$GITHUB_OUTPUT"
          done

          # Caminho do repositorio sem o host. O host contem o ID da conta e
          # seria redigido ao cruzar de um job para outro.
          repo_path="$(terraform output -raw ecr_repository_url | cut -d/ -f2-)"
          if [ -z "$repo_path" ]; then
            echo "::error::Nao foi possivel extrair o caminho do repositorio da ecr_repository_url."
            exit 1
          fi
          echo "ecr_repository_name=${repo_path}" >> "$GITHUB_OUTPUT"

          # Observabilidade (RFC-0004). Opcional de proposito: le com -json
          # porque o valor e `null` quando a stack esta desligada no
          # mechanical-hub-infra, e `-raw` falharia nesse caso. Sem coletor, a
          # aplicacao sobe com a exportacao de traces desativada em vez de o
          # deploy quebrar.
          otlp="$(terraform output -json otlp_http_endpoint 2>/dev/null | jq -r '. // ""')"
          echo "otlp_http_endpoint=${otlp}" >> "$GITHUB_OUTPUT"
          if [ -z "$otlp" ]; then
            echo "::warning::Coletor OpenTelemetry indisponivel nos states. A aplicacao sobe sem exportar traces; metricas e logs nao dependem deste valor."
          fi

      - name: Summary
        run: |
          {
            echo "### Infraestrutura resolvida (somente leitura)"
            echo ""
            echo "| Output | Valor | Origem |"
            echo "| --- | --- | --- |"
            echo "| eks_cluster_name | \`${{ steps.tf-outputs.outputs.eks_cluster_name }}\` | mechanical-hub-infra |"
            echo "| ecr_repository_url | \`${{ steps.tf-outputs.outputs.ecr_repository_url }}\` | mechanical-hub-infra |"
            echo "| rds_endpoint | \`${{ steps.tf-outputs.outputs.rds_endpoint }}\` | mechanical-hub-database |"
            echo "| rds_port | \`${{ steps.tf-outputs.outputs.rds_port }}\` | mechanical-hub-database |"
            echo "| rds_db_name | \`${{ steps.tf-outputs.outputs.rds_db_name }}\` | mechanical-hub-database |"
            echo "| rds_username | \`${{ steps.tf-outputs.outputs.rds_username }}\` | mechanical-hub-database |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 3: Build Docker image and push to ECR ───────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [resolve-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.image-meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr-repository-name }}:${{ steps.image-meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr-repository-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Deploy application to EKS ────────────────────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [resolve-infra, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Nao empurra imagem nenhuma aqui: o login serve so para obter o host do
      # registry (`steps.ecr-login.outputs.registry`) sem trafegar o ID da
      # conta entre jobs.
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.resolve-infra.outputs.eks-cluster-name }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes manifests
        env:
          ECR_REPOSITORY_URL: ${{ steps.ecr-login.outputs.registry }}/${{ needs.resolve-infra.outputs.ecr-repository-name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          DB_HOST: ${{ needs.resolve-infra.outputs.rds-endpoint }}
          DB_PORT: ${{ needs.resolve-infra.outputs.rds-port }}
          DB_NAME: ${{ needs.resolve-infra.outputs.rds-db-name }}
          DB_USERNAME: ${{ needs.resolve-infra.outputs.rds-username }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          OTLP_HTTP_ENDPOINT: ${{ needs.resolve-infra.outputs.otlp-http-endpoint }}
        run: |
          set -euo pipefail
          MANIFEST_DIR=src/main/resources/k8s

          # Observabilidade (RFC-0004). O Spring espera o caminho completo do
          # sinal, nao a raiz OTLP — dai o sufixo /v1/traces. Sem coletor no
          # ambiente, TRACING_ENABLED=false desliga a exportacao: o traceId
          # continua sendo gerado e indo para o log (que e o que liga log e
          # requisicao), so nao e enviado ao Tempo.
          if [ -n "${OTLP_HTTP_ENDPOINT}" ]; then
            export OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="${OTLP_HTTP_ENDPOINT}/v1/traces"
            export TRACING_ENABLED="true"
          else
            export OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=""
            export TRACING_ENABLED="false"
          fi

          kubectl apply -f $MANIFEST_DIR/namespace.yaml

          for manifest in \
            secret.yaml \
            configmap-app.yaml \
            deployment-app.yaml \
            service-app.yaml \
            hpa-app.yaml; do
            echo "→ Applying $manifest"
            envsubst < "$MANIFEST_DIR/$manifest" | kubectl apply -f -
          done

          # O ServiceMonitor e um objeto de CRD do Prometheus Operator. Aplicar
          # sem a CRD instalada falha o deploy inteiro por causa de um recurso
          # que so serve para monitoramento — por isso a verificacao antes.
          if kubectl get crd servicemonitors.monitoring.coreos.com > /dev/null 2>&1; then
            echo "→ Applying servicemonitor-app.yaml"
            kubectl apply -f "$MANIFEST_DIR/servicemonitor-app.yaml"
          else
            echo "::warning::CRD ServiceMonitor ausente — o Prometheus nao vai raspar as metricas da aplicacao. Aplique a stack de observabilidade no mechanical-hub-infra e rode este pipeline de novo."
          fi

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mechanical-hub-api \
            --namespace production \
            --timeout=600s

      - name: Debug — dump pod state on failure
        if: failure()
        run: |
          echo "═══════════════ Pod list ═══════════════"
          kubectl get pods -n production -o wide
          echo ""
          echo "═══════════════ ConfigMap (verify env vars resolved) ════"
          kubectl get configmap mechanical-hub-config -n production -o yaml || true
          echo ""
          echo "═══════════════ Pod events ══════════════"
          kubectl describe pods -n production -l app=mechanical-hub-api | tail -80
          echo ""
          echo "═══════════════ Container logs — PREVIOUS crash ══════════"
          for pod in $(kubectl get pods -n production -l app=mechanical-hub-api -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- previous logs: $pod ---"
            kubectl logs "$pod" -n production --previous --tail=100 2>/dev/null || echo "(no previous container logs — pod may not have completed a full crash cycle yet)"
            echo ""
            echo "--- current logs: $pod ---"
            kubectl logs "$pod" -n production --tail=100 || true
            echo ""
          done

      - name: Confirm service has healthy endpoints
        run: |
          echo "──────────────────────────────────────────"
          echo "NodePort: $(kubectl get svc mechanical-hub-svc -n production -o jsonpath='{.spec.ports[0].nodePort}')"
          echo ""
          kubectl get endpoints mechanical-hub-svc -n production
          echo ""
          echo "Acesso publico via API Gateway (repositorio mechanical-hub-auth)."
          echo "──────────────────────────────────────────"

      # Metrica que nao e raspada nao existe. Confirmar aqui evita descobrir o
      # painel vazio so na hora de gravar a demonstracao.
      - name: Confirm metrics endpoint is being served
        run: |
          set -uo pipefail
          pod="$(kubectl get pods -n production -l app=mechanical-hub-api \
                   -o jsonpath='{.items[0].metadata.name}')"

          echo "Conferindo /actuator/prometheus em ${pod}..."
          saida="$(kubectl exec -n production "$pod" -- \
                     curl -sS --max-time 10 http://localhost:8080/actuator/prometheus 2>/dev/null || true)"

          if [ -z "$saida" ]; then
            echo "::error::/actuator/prometheus nao respondeu. Confira a exposicao do endpoint (application.yml) e a liberacao no SecurityConfiguration."
            exit 1
          fi

          # A serie do Micrometer so aparece depois da primeira requisicao HTTP,
          # entao a verificacao usa uma metrica de JVM, sempre presente.
          if ! printf '%s' "$saida" | grep -q '^jvm_memory_used_bytes'; then
            echo "::error::O endpoint respondeu, mas sem metricas do Micrometer. Confira se micrometer-registry-prometheus esta no classpath."
            exit 1
          fi

          echo "OK — endpoint de metricas servindo $(printf '%s' "$saida" | grep -c '^# TYPE') familias de metrica."

          if kubectl get servicemonitor mechanical-hub-api -n production > /dev/null 2>&1; then
            echo "ServiceMonitor aplicado: o Prometheus vai descobrir este alvo em ate 30s."
          else
            echo "::warning::Sem ServiceMonitor — as metricas existem, mas ninguem as esta raspando."
          fi