spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

jpa:
  hibernate:
    ddl-auto: validate
  open-in-view: false

flyway:
  enabled: true
  baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.fiap.mechanical_hub: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info