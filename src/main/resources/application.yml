spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.fiap.mechanical_hub: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info