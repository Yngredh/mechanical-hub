apiVersion: v1
kind: Service
metadata:
  name: mechanical-hub-svc
  namespace: production
  # O ServiceMonitor seleciona SERVICES por estes rotulos (nao pods). Sem eles,
  # o Prometheus nao encontra alvo nenhum e falha em silencio: nenhum erro, so
  # paineis vazios.
  labels:
    app: mechanical-hub-api
    app.kubernetes.io/name: mechanical-hub
spec:
  type: NodePort
  selector:
    app: mechanical-hub-api
  ports:
    # O nome desta porta e o que o ServiceMonitor referencia em `endpoints.port`.
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
