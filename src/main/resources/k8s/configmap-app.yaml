apiVersion: v1
kind: ConfigMap
metadata:
  name: mechanical-hub-config
  namespace: production
  labels:
    app: mechanical-hub-api

data:
  DB_HOST: "${DB_HOST}"
  DB_PORT: "5432"
  DB_NAME: mechanical_hub
  DB_USERNAME: "${DB_USERNAME}"
  SPRING_PROFILES_ACTIVE: production
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
