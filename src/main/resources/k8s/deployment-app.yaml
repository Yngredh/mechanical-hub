apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanical-hub-api
  namespace: production
  labels:
    app: mechanical-hub-api
    version: "1.0.0"
    app.kubernetes.io/component: api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mechanical-hub-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: mechanical-hub-api

    spec:
      containers:
        - name: api
          image: ${ECR_REGISTRY}/mechanical-hub/api:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: mechanical-hub-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mechanical-hub-secrets
                  key: database-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mechanical-hub-secrets
                  key: jwt-secret
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -Xms128m -XX:+UseContainerSupport"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always
