apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanical-hub-api
  namespace: production
  labels:
    app: mechanical-hub-api
    version: "1.0.0"
    app.kubernetes.io/component: api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mechanical-hub-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: mechanical-hub-api
        # Rotulo padrao do Kubernetes. O processador k8sattributes do coletor
        # OpenTelemetry deriva dele o `service.name` dos logs, que no Loki vira
        # a label `service_name` — a mesma pela qual o painel de logs filtra.
        # Sem este rotulo, os logs chegam sem identificacao de servico.
        app.kubernetes.io/name: mechanical-hub

    spec:
      containers:
        - name: api
          image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: mechanical-hub-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mechanical-hub-secrets
                  key: database-password
            # -Xmx subiu de 384m para 448m junto com o limite do container: o
            # SDK do OpenTelemetry e o registro de metricas do Micrometer somam
            # heap e metaspace que antes nao existiam. Manter o valor antigo
            # deixaria a aplicacao mais perto do OOM sob carga — justamente
            # quando a observabilidade precisa funcionar.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx448m -Xms192m -XX:+UseContainerSupport"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always
